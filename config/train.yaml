seed: 1337
device: auto

model:
  # Production default. Use "simple" for architecture smoke-tests without downloading weights.
  backbone: convnext_tiny
  pretrained_backbone: true
  decoder_channels: 128
  simple_encoder_base: 48

data:
  # Dataset Wizard creates these manifests without duplicating the source datasets.
  train_root: data/cutoutnet/manifests/train.jsonl
  val_root: data/cutoutnet/manifests/val.jsonl
  image_size: 768
  targets:
    boundary_width: 2
    detail_width: 4
    residual_bg_width: 12
    uncertainty_width: 6

train:
  epochs: 40
  batch_size: 4
  val_batch_size: 2
  workers: 2
  lr: 0.0002
  weight_decay: 0.0001
  grad_clip: 1.0
  amp: true
  freeze_encoder_epochs: 1
  output_dir: checkpoints/cutoutnet

loss_weights:
  final: 1.00
  foreground: 0.70
  boundary: 0.80
  detail: 0.65
  residual_background: 0.65
  uncertainty: 0.30
  objectness: 0.30
